[package]
name        = "llama-harness"
version     = "0.1.0"
edition     = "2021"
rust-version = "1.75"
license     = "MIT OR Apache-2.0"
description = "Rust harness around llama.cpp: model switching, tool calling, streaming."

[dependencies]
llama-harness-ffi    = { workspace = true }
llama-harness-macros = { workspace = true }

tokio       = { workspace = true }
async-trait = { workspace = true }
async-stream = "0.3"
futures     = { workspace = true }

serde      = { workspace = true }
serde_json = { workspace = true }
toml       = { workspace = true }
schemars   = { workspace = true }
indexmap   = { workspace = true }

thiserror   = { workspace = true }
anyhow      = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }

uuid        = { workspace = true }
parking_lot = { workspace = true }
sha2        = { workspace = true }
hex         = { workspace = true }
dirs        = { workspace = true }
cxx         = "1.0"

[build-dependencies]
cxx-build = { version = "1.0" }
